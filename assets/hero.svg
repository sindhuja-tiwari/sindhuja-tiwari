<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Sindhuja Tiwari, AI and ML engineer. An animated HNSW search descends three graph layers to a query's nearest neighbour.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0b1324"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1" opacity=".55"/></pattern>
  <clipPath id="type"><rect x="60" y="300" height="40" width="0"><animate attributeName="width" values="0;560;560;0" keyTimes="0;.45;.9;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1"/></rect></clipPath>
</defs>
<style>
  .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
  .edge { stroke: #38bdf8; stroke-opacity: .28; stroke-width: 1.2; }
  .node { fill: #1e3a5f; stroke: #38bdf8; stroke-opacity: .7; stroke-width: 1.2; }
  .hit { fill: #38bdf8; animation: hit 6s infinite; }
  .route { fill: none; stroke: #fbbf24; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
           stroke-dasharray: var(--len); animation: draw 6s infinite; }
  .drop { stroke: #fbbf24; stroke-opacity: .35; stroke-dasharray: 3 5; }
  .pulse { fill: none; stroke: #fbbf24; animation: pulse 2s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes draw { 0%, 6% { stroke-dashoffset: var(--len); } 62%, 88% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  .cursor { animation: blink 1s steps(1) infinite; }
</style>

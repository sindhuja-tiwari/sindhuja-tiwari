<text x="60" y="92" class="m" font-size="15" fill="#38bdf8" letter-spacing="3">// AI · ML · VECTOR SEARCH · C++</text>
<text x="58" y="170" class="t" font-size="66" font-weight="700" fill="url(#name)">Sindhuja Tiwari</text>
<text x="60" y="222" class="t" font-size="24" fill="#e2e8f0">Artificial Intelligence &amp; Machine Learning Engineer</text>
<text x="60" y="262" class="t" font-size="18" fill="#94a3b8">Building intelligent systems that turn data into decisions.</text>
<g clip-path="url(#type)"><text x="60" y="326" class="m" font-size="17" fill="#e2e8f0"><tspan fill="#fbbf24">❯</tspan> search(query, k=1)  <tspan fill="#94a3b8">// O(log n), not O(n)</tspan></text></g>
